services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: insight_giver
      POSTGRES_USER: insight_giver
      POSTGRES_PASSWORD: insight_giver
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insight_giver -d insight_giver"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # The queue only holds entry ids (Postgres has the entries), but AOF keeps restarts from
    # leaving work for the stale-entry sweeper.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
